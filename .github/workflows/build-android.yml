name: Build Android APK

on:
  push:
    branches: ["*"]
    paths:
      - "game/**"
  workflow_dispatch:  # manual trigger from GitHub UI

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "fpv-voxel"

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup export templates
        run: |
          mkdir -p /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv /root/.local/share/godot/templates/${GODOT_VERSION}.stable/* /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ || true

      - name: Setup Android SDK
        run: |
          apt-get update && apt-get install -y openjdk-17-jdk wget unzip
          mkdir -p /root/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /root/android-sdk/cmdline-tools
          mv /root/android-sdk/cmdline-tools/cmdline-tools /root/android-sdk/cmdline-tools/latest
          yes | /root/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          /root/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Setup debug keystore
        run: |
          mkdir -p /root/.android
          keytool -genkey -v -keystore /root/.android/debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Debug, O=Debug, C=US"

      - name: Configure Godot Android settings
        run: |
          mkdir -p /root/.config/godot
          cat > /root/.config/godot/editor_settings-4.tres << 'SETTINGS'
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/root/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "/root/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Create export presets
        run: |
          cat > game/export_presets.cfg << 'PRESETS'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/fpv-voxel.apk"

          [preset.0.options]
          package/unique_name="com.fpvvoxel.game"
          package/name="FPV Voxel"
          version/code=1
          version/name="0.1.0"
          screen/orientation=1
          gradle_build/use_gradle_build=false
          PRESETS

      - name: Build APK
        run: |
          mkdir -p game/build
          cd game
          godot --headless --export-debug "Android" build/fpv-voxel.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fpv-voxel-android
          path: game/build/fpv-voxel.apk
          retention-days: 30
